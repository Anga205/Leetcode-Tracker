name: Ping Leetcode API for updates
on:
    schedule:
      - cron: '*/10 * * * *'
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: update-readings
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 1
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.24'
                  cache: true
                  cache-dependency-path: go.mod
            - name: Restore updater binary
              id: binary-cache
              uses: actions/cache@v4
              with:
                  path: .cache/update-manager
                  key: update-manager-${{ runner.os }}-go1.24-${{ hashFiles('go.mod', 'UpdateManager/**/*.go') }}
            - name: Run UpdateManager
              run: |
                mkdir -p .cache
                if [ "${{ steps.binary-cache.outputs.cache-hit }}" != "true" ]; then
                  go build -o .cache/update-manager ./UpdateManager
                fi
                chmod +x .cache/update-manager
                .cache/update-manager
            - name: Commit and push changes
              run: |
                  git config user.name 'Leetcode Update Bot'
                  git config user.email 'leetcode-update-bot@users.noreply.github.com'
                  git add ProgressViewer/public/readings.json
                  git commit -m 'Update progress data' || echo "No changes to commit"
                  git push origin main
