name: Ping Leetcode API for updates
on:
    schedule:
      - cron: '*/10 * * * *'
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: update-readings
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 1
            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt
            - name: Cache Rust dependencies and build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: UpdateManager -> target
                  cache-on-failure: true
            - name: Check formatting
              run: cargo fmt --manifest-path UpdateManager/Cargo.toml --all -- --check
            - name: Run tests
              run: cargo test --manifest-path UpdateManager/Cargo.toml --locked
            - name: Build updater
              run: cargo build --manifest-path UpdateManager/Cargo.toml --release --locked
            - name: Run UpdateManager
              run: UpdateManager/target/release/update-manager
            - name: Commit and push changes
              run: |
                  git config user.name 'Leetcode Update Bot'
                  git config user.email 'leetcode-update-bot@users.noreply.github.com'
                  git add ProgressViewer/public/readings.json
                  git commit -m 'Update progress data' || echo "No changes to commit"
                  git push origin main
